<!DOCTYPE html>
<!-- ============================================================
     minombre.html — Página para guardar el nombre del usuario
     Práctica 1 · Servicios Telemáticos · UAH

     El nombre se guarda en localStorage con la clave "fname".
     Después, en index.html, se lee y se muestra en el <aside>.
     ============================================================ -->

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi nombre — Smart Room</title>
    <link rel="stylesheet" href="css/iroom.css">
</head>

<body>

    <main>

        <!-- ENCABEZADO -->
        <header>
            <h1>Mi nombre</h1>
        </header>

        <!-- NAVEGACIÓN + INFO -->
        <div class="barra-superior">
            <nav>
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="config.html">Configuración</a></li>
                    <li><a href="minombre.html">Mi nombre</a></li>
                </ul>
            </nav>

            <aside id="info-usuario">
                <p>Información</p>
            </aside>
        </div>

        <!-- FORMULARIO para introducir el nombre.
             Tiene un solo campo + botón de guardar. -->
        <section id="seccion-nombre">
            <h2>Introduce tu nombre</h2>

            <form id="form-nombre">

                <label for="fname">Nombre:</label>
                <input type="text"
                       id="fname"
                       name="fname"
                       placeholder="Ej: Aníbal"
                       required
                       autofocus>

                <div class="form-acciones">
                    <button type="submit">Guardar nombre</button>
                    <p id="mensaje-nombre" role="alert"></p>
                </div>

            </form>
        </section>

        <!-- Enlace para volver al inicio -->
        <p class="volver">
            <a href="index.html">← Volver a la página principal</a>
        </p>

        <!-- PIE -->
        <footer>
            <p>Universidad de Alcalá</p>
        </footer>

    </main>

    <!-- Cargamos el script que gestiona el nombre -->
    <script src="js/nombre.js"></script>

</body>
</html>
