<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi nombre — Smart Room</title>
    <link rel="stylesheet" href="css/iroom.css">
</head>
<body>
    <main>
        <header>
            <h1>Mi nombre</h1>
        </header>

        <div class="barra-superior">
            <nav>
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="config.html">Configuración</a></li>
                    <li><a href="minombre.html">Mi nombre</a></li>
                    <li><a href="calculadora.html">Calculadora</a></li>
                </ul>
            </nav>
            <aside id="info-usuario">
                <p>Información</p>
            </aside>
        </div>

        <!-- SECCIÓN 1: GUARDAR NOMBRE (LocalStorage) -->
        <section id="seccion-nombre">
            <h2>Introduce tu nombre</h2>
            <form id="form-nombre">
                <label for="fname">Nombre:</label>
                <input type="text" id="fname" name="fname" placeholder="Ej: Aníbal" required autofocus>
                <div class="form-acciones">
                    <button type="submit">Guardar nombre</button>
                    <p id="mensaje-nombre" role="alert"></p>
                </div>
            </form>
        </section>

        <!-- SECCIÓN 2: VALIDACIÓN DE EMAIL (Apartado 3) -->
        <section id="seccion-email" style="margin-top: 2rem;">
            <h2>Validación de correo electrónico</h2>
            
            <label for="email">Correo:</label>
            <input type="text" id="email" placeholder="ejemplo@dominio.com">
            
            <div class="form-acciones" style="display: flex; gap: 1rem; justify-content: center; margin-top: 1rem;">
                <!-- type="button" evita que el formulario se envíe y recargue la página -->
                <button type="button" id="btn-sin-regex">Validar (Sin Regex)</button>
                <button type="button" id="btn-con-regex">Validar (Con Regex)</button>
            </div>
            
            <!-- Aquí se mostrará el resultado (Válido o Inválido) -->
            <p id="mensaje-email" class="mensaje-error" style="text-align: center; margin-top: 1rem;"></p>
        </section>

        <p class="volver">
            <a href="index.html">← Volver a la página principal</a>
        </p>

        <footer>
            <p>Universidad de Alcalá</p>
        </footer>
    </main>

    <!-- Cargamos el script que gestiona el nombre y el email -->
    <script src="js/nombre.js"></script>
</body>
</html>
