<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi nombre — Smart Room</title>
    <link rel="stylesheet" href="css/iroom.css">
</head>
<body>
    <main>
        <header>
            <h1>Mi nombre</h1>
        </header>

        <div class="barra-superior">
            <nav>
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="config.html">Configuración</a></li>
                    <li><a href="minombre.html">Mi nombre</a></li>
                </ul>
            </nav>
            <aside id="info-usuario">
                <p>Información</p>
            </aside>
        </div>

        <section id="seccion-nombre">
        <!-- Sección con el formulario del nombre. -->
            <h2>Introduce tu nombre</h2>

            <form id="form-nombre">
            <!-- Formulario. El id lo usa JS para escuchar el envío. -->
                <label for="fname">Nombre:</label>
                <input type="text" id="fname" name="fname"
                       placeholder="Ej: Aníbal"
                       required
                       autofocus>
                <!-- autofocus: al cargar la página, el cursor se pone aquí. -->

                <div class="form-acciones">
                    <button type="submit">Guardar nombre</button>
                    <p id="mensaje-nombre" role="alert"></p>
                    <!-- Aquí JS escribe el mensaje de confirmación o error. -->
                </div>
            </form>
        </section>

        <p class="volver">
            <a href="index.html">← Volver a la página principal</a>
        </p>

        <footer>
            <p>Universidad de Alcalá</p>
        </footer>
    </main>

    <script src="js/nombre.js"></script>
    <!-- Script que gestiona el guardado del nombre. -->
</body>
</html>
