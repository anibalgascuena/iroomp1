<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración — Smart Room</title>
    <link rel="stylesheet" href="css/iroom.css">
</head>
<body>
    <main>
        <header>
            <h1>Configuración de la Smart Room</h1>
        </header>

        <div class="barra-superior">
            <nav>
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="config.html">Configuración</a></li>
                    <li><a href="minombre.html">Mi nombre</a></li>
                    <li><a href="calculadora.html">Calculadora</a></li>
                </ul>
            </nav>
            <aside id="info-usuario">
                <p>Información</p>
            </aside>
        </div>

        <form id="form-config" novalidate>
            <div class="form-columnas">
                <section id="config-habitacion">
                    <h2>Datos de la habitación</h2>

                    <label for="pais">País:</label>
                    <input type="text" id="pais" name="pais" list="lista-paises" placeholder="Escribe o selecciona un país" required>
                    <datalist id="lista-paises">
                        <option value="España">
                        <option value="Francia">
                        <option value="Alemania">
                        <option value="Italia">
                        <option value="Portugal">
                        <option value="Reino Unido">
                        <option value="Países Bajos">
                        <option value="Bélgica">
                        <option value="Suiza">
                        <option value="Estados Unidos">
                        <option value="Canadá">
                        <option value="México">
                        <option value="Argentina">
                        <option value="Brasil">
                        <option value="Japón">
                        <option value="China">
                    </datalist>

                    <label for="ciudad">Ciudad:</label>
                    <input type="text" id="ciudad" name="ciudad" placeholder="Ej: Alcalá de Henares" required>

                    <label for="coordenadas">Coordenadas GPS (decimales o GMS):</label>
                    <input type="text" id="coordenadas" name="coordenadas" placeholder="40.513, -3.3486 o N 40° 30' 45, O 3° 20' 54" required>
                    <small id="error-coordenadas" class="mensaje-error"></small>
                    <div id="enlace-maps" style="margin-top: 0.5rem; font-weight: bold;"></div>

                    <label for="foto">Fotografía de la habitación:</label>
                    <input type="file" id="foto" name="foto" accept="image/*">

                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" placeholder="Introduce la contraseña" required>
                    <small id="indicador-password"></small>
                </section>

                <section id="config-sensores">
                    <h2>Seleccione los sensores</h2>
                    <div class="checkbox-group"><input type="checkbox" id="sensor-temp" name="sensores" value="temperatura" checked><label for="sensor-temp">Temperatura</label></div>
                    <div class="checkbox-group"><input type="checkbox" id="sensor-hum" name="sensores" value="humedad" checked><label for="sensor-hum">Humedad</label></div>
                    <div class="checkbox-group"><input type="checkbox" id="sensor-sonido" name="sensores" value="sonido"><label for="sensor-sonido">Nivel de sonido</label></div>
                    <div class="checkbox-group"><input type="checkbox" id="sensor-luz" name="sensores" value="luz"><label for="sensor-luz">Nivel de luz</label></div>
                    <div class="checkbox-group"><input type="checkbox" id="sensor-mov" name="sensores" value="movimiento"><label for="sensor-mov">Movimiento</label></div>

                    <h3>Configure alertas</h3>
                    <label for="temp-max">Temperatura máxima (°C):</label>
                    <input type="number" id="temp-max" name="temp-max" min="-20" max="45" step="0.5" value="25">
                    
                    <label for="temp-min">Temperatura mínima (°C):</label>
                    <input type="number" id="temp-min" name="temp-min" min="-20" max="45" step="0.5" value="15">
                    
                    <label for="temp-actual">Temperatura actual (°C):</label>
                    <input type="number" id="temp-actual" name="temp-actual" step="0.1" value="23">

                    <label for="diferencia">Diferencia (máx − mín):</label>
                    <output id="diferencia" name="diferencia">10</output>
                    <p id="mensaje-temp" class="mensaje-error" role="alert"></p>
                </section>
            </div>

            <div class="form-acciones">
                <button type="submit">Enviar datos</button>
            </div>
        </form>

        <!-- VENTANA MODAL ÚNICA PARA ERRORES -->
        <div id="modal-error" class="modal">
            <div class="modal-contenido">
                <p id="modal-mensaje"></p>
                <button id="modal-cerrar">Aceptar</button>
            </div>
        </div>

        <p class="volver">
            <a href="index.html">← Volver a la página principal</a>
        </p>

        <footer>
            <p>Universidad de Alcalá</p>
        </footer>
    </main>

    <!-- CARGAMOS LOS SCRIPTS -->
    <script src="js/datos.js"></script>
    <script src="js/nombre.js"></script>
</body>
</html>
